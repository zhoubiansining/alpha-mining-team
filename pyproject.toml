[project]
name = "alpha-mining"
version = "0.1.0"
description = "Multi-Agent Alpha Factor Mining System"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.5.7",
    "langchain-core>=1.3.2",
    "langchain-openai",
    "pydantic>=2.0",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
