[project]
name = "alpha-mining"
version = "0.1.0"
description = "Multi-Agent Alpha Factor Mining System"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.5.7",
    "langchain-core>=1.3.2",
    "langchain-openai",
    "pydantic>=2.0",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
data-api = [
    "akshare>=1.18",
    "pandas>=2.0",
    "pyarrow>=14",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[project.scripts]
data-api = "data_api.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
